<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="340" viewBox="0 0 1430 340"><rect width="1430" height="340" fill="#F4F1EA"/><g font-family="Geist, Segoe UI, sans-serif"><rect x="20" y="20" width="190" height="200" rx="10" fill="#0B0E14" stroke="#D8D3C8"/><text x="36" y="56" font-size="22" font-weight="600" fill="#F4F1EA">Midnight</text><text x="36" y="176" font-size="17" fill="#F4F1EA" font-family="Consolas, monospace">#0B0E14</text><text x="36" y="200" font-size="14" fill="#F4F1EA" font-family="Consolas, monospace" opacity="0.85">RGB 11 14 20</text><text x="20" y="252" font-size="16" fill="#0B0E14">Primary background. The</text><text x="20" y="274" font-size="16" fill="#0B0E14">hour before Q-day.</text><rect x="220" y="20" width="190" height="200" rx="10" fill="#F4F1EA" stroke="#D8D3C8"/><text x="236" y="56" font-size="22" font-weight="600" fill="#0B0E14">Paper</text><text x="236" y="176" font-size="17" fill="#0B0E14" font-family="Consolas, monospace">#F4F1EA</text><text x="236" y="200" font-size="14" fill="#0B0E14" font-family="Consolas, monospace" opacity="0.85">RGB 244 241 234</text><text x="220" y="252" font-size="16" fill="#0B0E14">Primary light background</text><text x="220" y="274" font-size="16" fill="#0B0E14">and text on Midnight.</text><rect x="420" y="20" width="190" height="200" rx="10" fill="#FFA630" stroke="#D8D3C8"/><text x="436" y="56" font-size="22" font-weight="600" fill="#0B0E14">Daybreak</text><text x="436" y="176" font-size="17" fill="#0B0E14" font-family="Consolas, monospace">#FFA630</text><text x="436" y="200" font-size="14" fill="#0B0E14" font-family="Consolas, monospace" opacity="0.85">RGB 255 166 48</text><text x="420" y="252" font-size="16" fill="#0B0E14">Signature accent: the</text><text x="420" y="274" font-size="16" fill="#0B0E14">origin cell, highlights.</text><text x="420" y="296" font-size="16" fill="#0B0E14">Never text on Paper.</text><rect x="620" y="20" width="190" height="200" rx="10" fill="#A84E08" stroke="#D8D3C8"/><text x="636" y="56" font-size="22" font-weight="600" fill="#F4F1EA">Ember</text><text x="636" y="176" font-size="17" fill="#F4F1EA" font-family="Consolas, monospace">#A84E08</text><text x="636" y="200" font-size="14" fill="#F4F1EA" font-family="Consolas, monospace" opacity="0.85">RGB 168 78 8</text><text x="620" y="252" font-size="16" fill="#0B0E14">Accent for text and links</text><text x="620" y="274" font-size="16" fill="#0B0E14">on Paper (4.95:1).</text><rect x="820" y="20" width="190" height="200" rx="10" fill="#9AA1B0" stroke="#D8D3C8"/><text x="836" y="56" font-size="22" font-weight="600" fill="#0B0E14">Mist</text><text x="836" y="176" font-size="17" fill="#0B0E14" font-family="Consolas, monospace">#9AA1B0</text><text x="836" y="200" font-size="14" fill="#0B0E14" font-family="Consolas, monospace" opacity="0.85">RGB 154 161 176</text><text x="820" y="252" font-size="16" fill="#0B0E14">Secondary text on</text><text x="820" y="274" font-size="16" fill="#0B0E14">Midnight (7.45:1).</text><rect x="1020" y="20" width="190" height="200" rx="10" fill="#5F6677" stroke="#D8D3C8"/><text x="1036" y="56" font-size="22" font-weight="600" fill="#F4F1EA">Ash</text><text x="1036" y="176" font-size="17" fill="#F4F1EA" font-family="Consolas, monospace">#5F6677</text><text x="1036" y="200" font-size="14" fill="#F4F1EA" font-family="Consolas, monospace" opacity="0.85">RGB 95 102 119</text><text x="1020" y="252" font-size="16" fill="#0B0E14">Secondary text on Paper</text><text x="1020" y="274" font-size="16" fill="#0B0E14">(5.10:1).</text><rect x="1220" y="20" width="190" height="200" rx="10" fill="#6B7385" stroke="#D8D3C8"/><text x="1236" y="56" font-size="22" font-weight="600" fill="#F4F1EA">Slate</text><text x="1236" y="176" font-size="17" fill="#F4F1EA" font-family="Consolas, monospace">#6B7385</text><text x="1236" y="200" font-size="14" fill="#F4F1EA" font-family="Consolas, monospace" opacity="0.85">RGB 107 115 133</text><text x="1220" y="252" font-size="16" fill="#0B0E14">Lines, grids and the</text><text x="1220" y="274" font-size="16" fill="#0B0E14">lattice pattern only.</text></g></svg>